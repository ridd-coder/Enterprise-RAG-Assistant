name: CI — Enterprise RAG Knowledge Assistant

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Ruff (linter)
        run: ruff check app/ tests/ scripts/

      - name: Run Black (format check)
        run: black --check app/ tests/ scripts/

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: quality

    env:
      # Use a dummy key for tests (services are mocked)
      OPENAI_API_KEY: test-key-not-real
      QDRANT_HOST: localhost
      QDRANT_PORT: 6333

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short --cov=app --cov-report=xml

      - name: Run integration tests (mocked)
        run: pytest tests/integration/ -v --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (API)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: enterprise-rag-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
