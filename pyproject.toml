[project]
name = "enterprise-rag-assistant"
version = "1.0.0"
description = "Enterprise RAG Knowledge Assistant — production-grade document Q&A system"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.urls]
Repository = "https://github.com/your-username/enterprise-rag-assistant"

# ======================================================
# Ruff — Linter
# ======================================================
[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long — handled by Black
    "B008",  # function calls in argument defaults (FastAPI Depends pattern)
]
exclude = [
    ".git",
    "__pycache__",
    "venv",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ======================================================
# Black — Formatter
# ======================================================
[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

# ======================================================
# Pytest
# ======================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

# ======================================================
# Coverage
# ======================================================
[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
